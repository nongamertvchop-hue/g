<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>เข้าสู่ระบบ</h1>
                <p>กรุณากรอกข้อมูลเพื่อเข้าใช้งาน</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">ชื่อผู้ใช้</label>
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
                </div>

                <div class="input-group">
                    <label for="password">รหัสผ่าน</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
                        <button type="button" class="toggle-password" id="togglePassword">👁</button>
                    </div>
                </div>

                <div id="errorMessage" class="error-message"></div>

                <button type="submit" class="btn btn-login">เข้าสู่ระบบ</button>
            </form>

            <div class="login-footer">
                <a href="#" class="btn btn-register">สมัครสมาชิก</a>
                <a href="#" class="forgot-password">ลืมรหัสผ่าน?</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
